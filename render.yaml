services:
  - type: web
    name: bereke-web
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: node --import ./scripts/sites-env.mjs ./node_modules/wrangler/bin/wrangler.js dev --config dist/server/wrangler.json --local --persist-to .wrangler/state --ip 0.0.0.0 --port $PORT
    envVars:
      - key: DJANGO_API_URL
        fromService:
          name: bereke-api
          type: web
          property: hostport

  - type: web
    name: bereke-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bereke-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: FRONTEND_URL
        fromService:
          name: bereke-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        fromService:
          name: bereke-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DJANGO_EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: DJANGO_EMAIL_HOST
        value: smtp.gmail.com
      - key: DJANGO_EMAIL_PORT
        value: "587"
      - key: DJANGO_EMAIL_USE_TLS
        value: "1"
      - key: DJANGO_EMAIL_USER
        sync: false
      - key: DJANGO_EMAIL_PASSWORD
        sync: false
      - key: DJANGO_FROM_EMAIL
        sync: false

databases:
  - name: bereke-db
    plan: free
