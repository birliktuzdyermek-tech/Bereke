services:
  - type: web
    name: bereke-web
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && BEREKE_TARGET=node pnpm build
    startCommand: node node_modules/vinext/dist/cli.js start --hostname 0.0.0.0 --port $PORT
    envVars:
      # Free web services can send but not receive private-network traffic,
      # so the proxy reaches Django over its public https URL.
      - key: DJANGO_API_URL
        fromService:
          name: bereke-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: BEREKE_PROXY_SECRET
        fromService:
          name: bereke-api
          type: web
          envVarKey: BEREKE_PROXY_SECRET

  - type: web
    name: bereke-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # preDeployCommand is not available on the free plan, so migrations and the
    # rate-limit cache table are applied on every start (both are idempotent).
    startCommand: python manage.py migrate --noinput && python manage.py createcachetable && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bereke-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: BEREKE_PROXY_SECRET
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: FRONTEND_URL
        fromService:
          name: bereke-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        fromService:
          name: bereke-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DJANGO_EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      # Free Render services cannot reach SMTP ports 25/465/587, so mail goes
      # through the Brevo relay on 2525 (STARTTLS). DJANGO_EMAIL_USER is the
      # Brevo SMTP login, DJANGO_EMAIL_PASSWORD an SMTP key, and
      # DJANGO_FROM_EMAIL a sender address verified in Brevo.
      - key: DJANGO_EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: DJANGO_EMAIL_PORT
        value: "2525"
      - key: DJANGO_EMAIL_USE_TLS
        value: "1"
      - key: DJANGO_EMAIL_USER
        sync: false
      - key: DJANGO_EMAIL_PASSWORD
        sync: false
      - key: DJANGO_FROM_EMAIL
        sync: false

databases:
  - name: bereke-db
    plan: free
